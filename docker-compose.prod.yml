services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sahay_backend
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-sahay-super-secret-key-production-change-this}
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-sahay_admin}:${POSTGRES_PASSWORD:-SecurePassword123!}@postgres:5432/${POSTGRES_DB:-sahay_db}
      - SQLITE_FALLBACK=True
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AI_MODEL=${AI_MODEL:-gemini-3.1-flash-lite}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - postgres
    networks:
      - sahay_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sahay_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - sahay_network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: sahay_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sahay_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SecurePassword123!}
      POSTGRES_DB: ${POSTGRES_DB:-sahay_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sahay_admin} || pg_isready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - sahay_network

  redis:
    image: redis:7-alpine
    container_name: sahay_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - sahay_network

volumes:
  postgres_data:
  redis_data:

networks:
  sahay_network:
    driver: bridge
